services:
  - type: web
    name: devcollective-app
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit

  - type: web
    name: devcollective-ws
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start:ws
    healthCheckPath: /health
    autoDeployTrigger: commit
